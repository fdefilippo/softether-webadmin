<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"historyCacheSize":0,"refreshOnHistoryMiss":true,"includeIndicatorStyles":false,"selfRequestsOnly":true}'>
<title>{{.T "app.title"}}</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js"></script>
</head>
<body{{if .Session}} hx-headers='{{.HXHeaders}}'{{end}}>
<header class="topbar">
  <span class="brand">{{.T "app.title"}}</span>
  <nav class="tools" aria-label="{{.T "lang.label"}}">
    <a href="/lang?l=en&amp;next={{.Next}}" hreflang="en" lang="en">{{.T "lang.en"}}</a>
    <a href="/lang?l=it&amp;next={{.Next}}" hreflang="it" lang="it">{{.T "lang.it"}}</a>
    {{if .Session}}
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <button type="submit">{{.T "nav.logout"}}</button>
    </form>
    {{end}}
  </nav>
</header>
<main id="main">
{{template "content" .}}
</main>
</body>
</html>
